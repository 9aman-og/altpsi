<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AltPsi and Aero</title>
  <desc id="desc">Say the outcome. Aero carries the context.</desc>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1010 80) rotate(128) scale(510 580)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#315ec7" stop-opacity=".34"/>
      <stop offset="1" stop-color="#315ec7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="706" y1="116" x2="1110" y2="524" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202633"/>
      <stop offset="1" stop-color="#0c0f16"/>
    </linearGradient>
    <linearGradient id="flow" x1="770" y1="315" x2="1050" y2="315" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54e7f5" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#63dff7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1200" height="630" fill="#07090e"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="94" cy="548" r="155" fill="#7556db" fill-opacity=".13" filter="url(#blur)"/>

  <g transform="translate(64 52)">
    <rect width="46" height="46" rx="13" fill="#10141d" stroke="#fff" stroke-opacity=".16"/>
    <path d="M23 10v26M12 12v8c0 8 5 14 11 14s11-6 11-14v-8" fill="none" stroke="#f5f7fb" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M12 12v8c0 6 3 11 8 13" fill="none" stroke="#64e9f5" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M8 8h9" fill="none" stroke="#64e9f5" stroke-width="2" stroke-linecap="round"/>
    <text x="61" y="31" fill="#f6f7fb" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="-0.6">AltPsi</text>
  </g>

  <text x="64" y="226" fill="#f5f6f8" font-family="Inter, Arial, sans-serif" font-size="70" font-weight="650" letter-spacing="-4.8">Say the outcome.</text>
  <text x="64" y="306" fill="#939aaa" font-family="Inter, Arial, sans-serif" font-size="70" font-weight="650" letter-spacing="-4.8">Aero carries</text>
  <text x="64" y="386" fill="#f5f6f8" font-family="Inter, Arial, sans-serif" font-size="70" font-weight="650" letter-spacing="-4.8">the context.</text>
  <text x="67" y="440" fill="#8f96a4" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" letter-spacing="1.2">PRIVATE  /  INSPECTABLE  /  REVIEWABLE</text>

  <g transform="translate(724 102)">
    <rect width="412" height="426" rx="72" fill="url(#card)" stroke="#fff" stroke-opacity=".17"/>
    <path d="M73 159h130M54 213h171M87 267h116" fill="none" stroke="#55e7f4" stroke-linecap="round" stroke-width="17" opacity=".72"/>
    <path d="m187 123 167 90-167 90v-55l66-35-66-35Z" fill="url(#flow)"/>
    <path d="m196 139 135 74-135 74" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="72" cy="356" r="7" fill="#b8f55c"/>
    <text x="92" y="362" fill="#a8afbd" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" letter-spacing="1">AERO IS READY</text>
  </g>
</svg>
