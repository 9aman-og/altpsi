name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-boundary:
    name: Public boundary, links, and secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/checks.py

  aero-tests:
    name: Aero safety, memory, execution, and harness invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.1.x"
      - run: |
          node --check site.js
          node --check aero/site.js
          node --check app/aero-core.js
          node --check app/aero-eval.js
          node --check app/aero-harness.js
          node --check app/cloud.js
          node --check app/app.js
          node --check app/connect.js
          node --check app/connect-suite.js
          node app/aero-core.test.js
          node app/aero-eval.test.js
          node app/aero-memory.test.js
          node app/aero-memory.benchmark.js
          node app/aero-harness.test.js
          node app/aero-harness.benchmark.js
          node app/cloud.test.js
          node --test app/aero-server-memory.test.mjs
          node --test supabase/functions/aero-execute/protocol.test.mjs
          node --test supabase/functions/aero-memory/protocol.test.mjs
          node --test supabase/functions/aero-presence/protocol.test.mjs
          node --test supabase/migrations/aero_execution_boundary.test.mjs
          node --test supabase/migrations/aero_server_owned_memory.test.mjs
          node --test supabase/migrations/aero_presence_boundary.test.mjs
          deno check supabase/functions/aero-execute/index.ts
          deno check supabase/functions/aero-memory/index.ts
          deno check supabase/functions/aero-presence/index.ts

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
